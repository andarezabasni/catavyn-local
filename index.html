<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catavyn — Free Notes & Daily Tasks App</title>
    <meta name="description" content="Catavyn is a free, lightweight notes and daily task app with a warm, paper-like design. Organize notes with categories and tags, plan your day, and collaborate — on web and desktop." />
    <link rel="canonical" href="https://catavyn.fun/" />

    <!-- Open Graph (link previews on WhatsApp, Facebook, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Catavyn" />
    <meta property="og:title" content="Catavyn — Free Notes & Daily Tasks App" />
    <meta property="og:description" content="A free, lightweight notes and daily task app with a warm, paper-like design. No lock-in — export your notes anytime." />
    <meta property="og:url" content="https://catavyn.fun/" />
    <meta property="og:image" content="https://catavyn.fun/logo.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Catavyn — Free Notes & Daily Tasks App" />
    <meta name="twitter:description" content="A free, lightweight notes and daily task app with a warm, paper-like design." />
    <meta name="twitter:image" content="https://catavyn.fun/logo.png" />

    <!-- Structured data so Google understands what Catavyn is -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Catavyn",
      "url": "https://catavyn.fun/",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "A free, lightweight notes and daily task app with a warm, paper-like design. Organize notes with categories and tags, plan your day, and collaborate."
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <script>if(localStorage.getItem('catavyn-theme')==='dark')document.documentElement.classList.add('dark')</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
