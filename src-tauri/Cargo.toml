[package]
name = "catavyn"
version = "0.1.0"
description = "Catavyn - Note-taking & daily task app"
authors = []
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "catavyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# `bundled` compiles SQLite from source so the app never depends on a
# system-installed SQLite — keeps the desktop build self-contained and portable.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
thiserror = "2"
# Decode images to read dimensions and generate thumbnails. Default features
# cover PNG/JPEG/WebP/GIF/BMP — the formats we support in this phase.
image = "0.25"

# --- Vault (security-critical) -------------------------------------------
# RustCrypto stack for the encrypted Vault. Versions chosen for compatibility
# with the current tree (rustc 1.96.1); see docs/VAULT_SECURITY_SPEC.md.
argon2 = "0.5"                       # Argon2id key derivation (KEK)
chacha20poly1305 = "0.10"           # XChaCha20-Poly1305 AEAD
zeroize = { version = "1", features = ["derive"] }  # zeroize key material
getrandom = "0.2"                    # OS CSPRNG for salt/nonce/DEK
totp-rs = "5"                        # TOTP generation (no manual crypto)

# --- Backup & Restore ----------------------------------------------------
# Single .catavyn = zstd(tar(...)). Streaming; no custom archive/compression.
tar = "0.4"
zstd = "0.13"
sha2 = "0.10"                        # SHA-256 integrity manifest
